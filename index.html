<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta property="og:title" content="♟ ChessFred — Visionneur de partie">
<meta property="og:description" content="Visionnez cette partie d'échecs coup par coup">
<title>♟ ChessFred Viewer</title>
<style>
:root {
  --bg: #2c1a0e;
  --surface: #3d2410;
  --surface2: #4e2f14;
  --border: #8b5a2b;
  --gold: #d4a030;
  --gold-light: #f0c84a;
  --gold-dim: #9a7040;
  --light-sq: #f0d090;
  --dark-sq: #b07838;
  --text: #f5e6c8;
  --text-dim: #b8905a;
  --btn: #5a3418;
  --btn-border: #9a6a30;
  --btn-text: #f5dfa0;
  --sq: 72px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: Georgia, serif;
  background-image:
    radial-gradient(ellipse at 20% 10%, rgba(160,90,30,0.3) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 90%, rgba(100,50,10,0.35) 0%, transparent 50%);
}
.container {
  max-width: 700px;
  margin: 0 auto;
  padding: 20px 16px 40px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}
.logo {
  font-size: 1.4rem;
  color: var(--gold-light);
  font-weight: bold;
  letter-spacing: 0.1em;
  text-align: center;
}
.logo span {
  display: block;
  font-size: 0.65rem;
  color: var(--gold-dim);
  letter-spacing: 0.3em;
  text-transform: uppercase;
  margin-top: 2px;
}
/* Game info */
.game-info {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 16px;
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.game-players {
  font-size: 1rem;
  color: var(--text);
  font-weight: bold;
}
.game-meta {
  font-size: 0.75rem;
  color: var(--text-dim);
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}
.game-result {
  color: var(--gold-light);
  font-weight: bold;
}

/* Board */
.board-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
}
.board-outer {
  position: relative;
  background: linear-gradient(135deg, #5a3418, #3d2410);
  border: 2px solid #8b5a2b;
  border-radius: 6px;
  box-shadow: 0 6px 30px rgba(0,0,0,0.7);
  padding: 6px 6px 22px 22px;
}
.board {
  display: grid;
  grid-template-columns: repeat(8, var(--sq));
  grid-template-rows: repeat(8, var(--sq));
}
.coord-files { position:absolute; bottom:3px; left:22px; display:flex; width:calc(8*var(--sq)); }
.coord-ranks { position:absolute; left:3px; top:6px; display:flex; flex-direction:column; }
.coord { width:var(--sq); height:18px; display:flex; align-items:center; justify-content:center; font-size:0.62rem; color:var(--gold-light); font-weight:bold; user-select:none; }
.coord-rank { width:18px; height:var(--sq); display:flex; align-items:center; justify-content:center; font-size:0.62rem; color:var(--gold-light); font-weight:bold; user-select:none; }
.square { width:var(--sq); height:var(--sq); display:flex; align-items:center; justify-content:center; position:relative; }
.sq-l { background: var(--light-sq); }
.sq-d { background: var(--dark-sq); }
.sq-from { box-shadow: inset 0 0 0 3px rgba(255,215,40,0.4); }
.sq-to   { box-shadow: inset 0 0 0 3px rgba(255,215,40,0.78); }
.square img { width:calc(var(--sq)*0.86); height:calc(var(--sq)*0.86); user-select:none; pointer-events:none; filter:drop-shadow(0 2px 4px rgba(0,0,0,0.8)); }
.piece-b { filter:drop-shadow(0 0 2px rgba(255,255,255,0.5)) drop-shadow(0 2px 4px rgba(0,0,0,0.9)); }

/* Navigation */
.nav-bar {
  display: flex;
  gap: 8px;
  align-items: center;
  justify-content: center;
  width: 100%;
}
.nav-btn {
  padding: 10px 18px;
  background: linear-gradient(180deg, #7a4820, #3d2008);
  color: var(--btn-text);
  border: 1px solid var(--btn-border);
  border-radius: 7px;
  font-size: 1.1rem;
  cursor: pointer;
  transition: background 0.15s;
  box-shadow: 0 2px 5px rgba(0,0,0,0.4);
}
.nav-btn:hover { background: linear-gradient(180deg, #a06030, #5a2e0e); }
.nav-btn:disabled { opacity: 0.3; cursor: default; }
.move-counter {
  font-size: 0.85rem;
  color: var(--text-dim);
  min-width: 80px;
  text-align: center;
}

/* Move list */
.moves-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  width: 100%;
  max-height: 200px;
  overflow-y: auto;
}
.moves-panel h3 {
  font-size: 0.72rem;
  color: var(--gold-light);
  text-transform: uppercase;
  letter-spacing: 0.14em;
  margin-bottom: 8px;
  padding-bottom: 5px;
  border-bottom: 1px solid var(--border);
}
.moves-panel::-webkit-scrollbar { width: 4px; }
.moves-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
.moves-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 2px 4px;
}
.mv-pair { display: flex; gap: 2px; align-items: center; }
.mv-num { font-size: 0.7rem; color: var(--text-dim); padding: 0 2px; }
.mv-w, .mv-b {
  padding: 2px 6px;
  border-radius: 3px;
  font-size: 0.82rem;
  cursor: pointer;
  color: var(--text);
  transition: background 0.1s;
}
.mv-w:hover, .mv-b:hover { background: var(--surface2); }
.mv-w.active, .mv-b.active {
  background: var(--gold);
  color: #1a0a00;
  font-weight: bold;
}

/* Error */
.error-box {
  background: #5a1a0a;
  border: 1px solid #dd4422;
  border-radius: 8px;
  padding: 16px;
  text-align: center;
  color: #ffaa80;
  font-size: 0.9rem;
  width: 100%;
}

/* Share button */
.share-btn {
  padding: 9px 18px;
  background: var(--btn);
  color: var(--btn-text);
  border: 1px solid var(--btn-border);
  border-radius: 7px;
  font-size: 0.85rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
}
.share-btn:hover { background: #7a4820; }
</style>
</head>
<body>
<div class="container">
  <div class="logo">♟ ChessFred<span>Visionneur de partie</span></div>

  <div id="game-info" class="game-info" style="display:none">
    <div class="game-players" id="players">? vs ?</div>
    <div class="game-meta">
      <span id="meta-date"></span>
      <span id="meta-event"></span>
      <span id="meta-tc"></span>
      <span class="game-result" id="meta-result"></span>
    </div>
  </div>

  <div id="error-box" class="error-box" style="display:none">
    ❌ Aucune partie à afficher.<br>
    <span style="font-size:0.78rem;color:var(--text-dim);">Utilisez le générateur de lien pour créer un lien partageable.</span>
  </div>

  <div class="board-wrap" id="board-wrap">
    <div class="board-outer">
      <div id="coord-ranks" class="coord-ranks"></div>
      <div id="board" class="board"></div>
      <div id="coord-files" class="coord-files"></div>
    </div>
  </div>

  <div class="nav-bar">
    <button class="nav-btn" id="btn-start" onclick="goTo(0)">⏮</button>
    <button class="nav-btn" id="btn-prev"  onclick="step(-1)">◀</button>
    <span class="move-counter" id="move-counter">Position initiale</span>
    <button class="nav-btn" id="btn-next"  onclick="step(1)">▶</button>
    <button class="nav-btn" id="btn-end"   onclick="goTo(-1)">⏭</button>
  </div>

  <div class="moves-panel" id="moves-panel" style="display:none">
    <h3>Coups</h3>
    <div class="moves-grid" id="moves-grid"></div>
  </div>

  <button class="share-btn" onclick="copyLink()">🔗 Copier ce lien</button>
</div>

<script>
const PI={
  P:"https://upload.wikimedia.org/wikipedia/commons/4/45/Chess_plt45.svg",
  R:"https://upload.wikimedia.org/wikipedia/commons/7/72/Chess_rlt45.svg",
  N:"https://upload.wikimedia.org/wikipedia/commons/7/70/Chess_nlt45.svg",
  B:"https://upload.wikimedia.org/wikipedia/commons/b/b1/Chess_blt45.svg",
  Q:"https://upload.wikimedia.org/wikipedia/commons/1/15/Chess_qlt45.svg",
  K:"https://upload.wikimedia.org/wikipedia/commons/4/42/Chess_klt45.svg",
  p:"https://upload.wikimedia.org/wikipedia/commons/c/c7/Chess_pdt45.svg",
  r:"https://upload.wikimedia.org/wikipedia/commons/f/ff/Chess_rdt45.svg",
  n:"https://upload.wikimedia.org/wikipedia/commons/e/ef/Chess_ndt45.svg",
  b:"https://upload.wikimedia.org/wikipedia/commons/9/98/Chess_bdt45.svg",
  q:"https://upload.wikimedia.org/wikipedia/commons/4/47/Chess_qdt45.svg",
  k:"https://upload.wikimedia.org/wikipedia/commons/f/f0/Chess_kdt45.svg"
};
const W=p=>p&&p===p.toUpperCase();
function initB(){return[["r","n","b","q","k","b","n","r"],["p","p","p","p","p","p","p","p"],["","","","","","","",""],["","","","","","","",""],["","","","","","","",""],["","","","","","","",""],["P","P","P","P","P","P","P","P"],["R","N","B","Q","K","B","N","R"]];}
function CL(b){return JSON.parse(JSON.stringify(b));}

let states=[], cursor=0, parsedMoves=[];

/* ── BOARD SIZING ── */
function setSqSize(){
  let w=Math.min(window.innerWidth-60, 560);
  let sq=Math.floor(w/8);
  sq=Math.max(38,Math.min(90,sq));
  document.documentElement.style.setProperty("--sq",sq+"px");
}

/* ── DRAW ── */
function drawBoard(state){
  let b=document.getElementById("board");b.innerHTML="";
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    let d=document.createElement("div");
    d.className="square "+((r+c)%2===0?"sq-l":"sq-d");
    if(state.lm){
      if(state.lm.r1===r&&state.lm.c1===c)d.classList.add("sq-from");
      if(state.lm.r2===r&&state.lm.c2===c)d.classList.add("sq-to");
    }
    let p=state.board[r][c];
    if(p){let img=document.createElement("img");img.src=PI[p];if(!W(p))img.classList.add("piece-b");d.appendChild(img);}
    b.appendChild(d);
  }
  const files="abcdefgh",ranks="87654321";
  let fr=document.getElementById("coord-files"),rk=document.getElementById("coord-ranks");
  fr.innerHTML="";rk.innerHTML="";
  for(let i=0;i<8;i++){
    let f=document.createElement("div");f.className="coord";f.innerText=files[i];fr.appendChild(f);
    let rv=document.createElement("div");rv.className="coord-rank";rv.innerText=ranks[i];rk.appendChild(rv);
  }
  // Counter
  let total=states.length-1;
  let txt=cursor===0?"Position initiale":`Coup ${cursor}/${total}`;
  document.getElementById("move-counter").textContent=txt;
  // Nav buttons
  document.getElementById("btn-start").disabled=cursor===0;
  document.getElementById("btn-prev").disabled=cursor===0;
  document.getElementById("btn-next").disabled=cursor>=total;
  document.getElementById("btn-end").disabled=cursor>=total;
  // Highlight move in list
  document.querySelectorAll(".mv-w,.mv-b").forEach(e=>e.classList.remove("active"));
  if(cursor>0){let el=document.getElementById("mv-"+cursor);if(el){el.classList.add("active");el.scrollIntoView({block:"nearest"});}}
}

function goTo(idx){
  if(idx<0)idx=states.length-1;
  cursor=Math.max(0,Math.min(states.length-1,idx));
  drawBoard(states[cursor]);
}
function step(d){ goTo(cursor+d); }

/* ── MOVE LIST ── */
function buildMoveList(moves){
  let grid=document.getElementById("moves-grid");grid.innerHTML="";
  let pairs=[];
  for(let i=0;i<moves.length;i+=2) pairs.push({w:moves[i],b:moves[i+1]||""});
  pairs.forEach((p,i)=>{
    let d=document.createElement("div");d.className="mv-pair";
    let n=document.createElement("span");n.className="mv-num";n.textContent=(i+1)+".";
    let w=document.createElement("span");w.className="mv-w";w.textContent=p.w;w.id="mv-"+(i*2+1);
    w.onclick=()=>goTo(i*2+1);
    d.appendChild(n);d.appendChild(w);
    if(p.b){
      let bl=document.createElement("span");bl.className="mv-b";bl.textContent=p.b;bl.id="mv-"+(i*2+2);
      bl.onclick=()=>goTo(i*2+2);
      d.appendChild(bl);
    }
    grid.appendChild(d);
  });
  document.getElementById("moves-panel").style.display="block";
}

/* ── PGN PARSER ── */
function parsePGN(pgn){
  let headers={};
  let hReg=/\[(\w+)\s+"([^"]*)"\]/g, m;
  while((m=hReg.exec(pgn))!==null) headers[m[1]]=m[2];
  let text=pgn.replace(/\[.*?\]\s*/g,"").trim();
  text=text.replace(/\{[^}]*\}/g,"");
  let prev="";while(prev!==text){prev=text;text=text.replace(/\([^()]*\)/g,"");}
  text=text.replace(/1-0|0-1|1\/2-1\/2|\*/g,"");
  text=text.replace(/\d+\.+/g," ");
  let tokens=text.split(/\s+/).map(t=>t.trim()).filter(t=>t.length>0&&!/^\d+$/.test(t));
  return{headers,tokens};
}

function pathClear(b,r1,c1,r2,c2){
  let dr=Math.sign(r2-r1),dc=Math.sign(c2-c1),r=r1+dr,c=c1+dc;
  while(r!==r2||c!==c2){if(b[r][c])return false;r+=dr;c+=dc;}
  return true;
}
function canReach(piece,r1,c1,r2,c2,b,ep){
  let pl=piece.toLowerCase(),dr=r2-r1,dc=c2-c1,t=b[r2][c2];
  switch(pl){
    case"p":{
      let d=W(piece)?-1:1;
      if(dc===0&&!t&&dr===d)return true;
      if(dc===0&&!t&&dr===2*d&&!b[r1+d][c1]&&((W(piece)&&r1===6)||(!W(piece)&&r1===1)))return true;
      if(Math.abs(dc)===1&&dr===d&&(t||(ep&&r2===ep.r&&c2===ep.c)))return true;
      return false;
    }
    case"n":return(Math.abs(dr)===2&&Math.abs(dc)===1)||(Math.abs(dr)===1&&Math.abs(dc)===2);
    case"b":return Math.abs(dr)===Math.abs(dc)&&pathClear(b,r1,c1,r2,c2);
    case"r":return(dr===0||dc===0)&&pathClear(b,r1,c1,r2,c2);
    case"q":return(dr===0||dc===0||Math.abs(dr)===Math.abs(dc))&&pathClear(b,r1,c1,r2,c2);
    case"k":return Math.abs(dr)<=1&&Math.abs(dc)<=1;
  }
  return false;
}

function sanToMove(san,color,b,ep){
  if(san==="O-O"||san==="0-0"){let r=color==="white"?7:0;return{r,c:4,r2:r,c2:6};}
  if(san==="O-O-O"||san==="0-0-0"){let r=color==="white"?7:0;return{r,c:4,r2:r,c2:2};}
  san=san.replace(/[+#!?]/g,"");
  let promo=null;
  if(san.includes("=")){promo=san.split("=")[1][0];san=san.split("=")[0];}
  const files="abcdefgh";
  let pieceChar="P";
  if(san[0]>="A"&&san[0]<="Z"){pieceChar=san[0];san=san.slice(1);}
  san=san.replace("x","");
  if(san.length<2)return null;
  let c2=files.indexOf(san[san.length-2]),r2=8-parseInt(san[san.length-1]);
  if(c2<0||isNaN(r2))return null;
  let remain=san.slice(0,san.length-2),df=-1,drf=-1;
  for(let ch of remain){if(files.includes(ch))df=files.indexOf(ch);else if(ch>="1"&&ch<="8")drf=8-parseInt(ch);}
  let piece=color==="white"?pieceChar:pieceChar.toLowerCase();
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    if(b[r][c]!==piece)continue;
    if(df>=0&&c!==df)continue;
    if(drf>=0&&r!==drf)continue;
    if(!canReach(piece,r,c,r2,c2,b,ep))continue;
    return{r,c,r2,c2,promo};
  }
  return null;
}

function doMove(b,r1,c1,r2,c2){
  let p=b[r1][c1];
  if(p==="K"&&r1===7&&c1===4){if(c2===6){b[7][5]="R";b[7][7]="";}if(c2===2){b[7][3]="R";b[7][0]="";}}
  if(p==="k"&&r1===0&&c1===4){if(c2===6){b[0][5]="r";b[0][7]="";}if(c2===2){b[0][3]="r";b[0][0]="";}}
  b[r2][c2]=p;b[r1][c1]="";
}

function buildStates(tokens){
  let b=initB(),t="white",ep=null;
  let sts=[{board:CL(b),lm:null}];
  for(let san of tokens){
    let mv=sanToMove(san,t,b,ep);
    if(!mv)break;
    // En passant capture
    let p=b[mv.r][mv.c];
    if(p.toLowerCase()==="p"&&ep&&mv.r2===ep.r&&mv.c2===ep.c) b[W(p)?mv.r2+1:mv.r2-1][mv.c2]="";
    doMove(b,mv.r,mv.c,mv.r2,mv.c2);
    // Promotion
    if(mv.promo){let pp=t==="white"?mv.promo.toUpperCase():mv.promo.toLowerCase();b[mv.r2][mv.c2]=pp;}
    else{let px=b[mv.r2][mv.c2];if(px==="P"&&mv.r2===0)b[mv.r2][mv.c2]="Q";if(px==="p"&&mv.r2===7)b[mv.r2][mv.c2]="q";}
    // En passant state
    ep=null;
    if(p.toLowerCase()==="p"&&Math.abs(mv.r2-mv.r)===2)ep={r:(mv.r+mv.r2)/2,c:mv.c};
    sts.push({board:CL(b),lm:{r1:mv.r,c1:mv.c,r2:mv.r2,c2:mv.c2}});
    t=t==="white"?"black":"white";
  }
  return sts;
}

/* ── INIT ── */
function init(){
  setSqSize();
  let params=new URLSearchParams(window.location.search);
  let pgn=params.get("pgn");

  if(!pgn){
    document.getElementById("error-box").style.display="block";
    drawBoard({board:initB(),lm:null});
    return;
  }

  pgn=pgn.replace(/\+/g," ");
  let{headers,tokens}=parsePGN(pgn);

  // Afficher infos
  let white=headers.White||"Blancs", black=headers.Black||"Noirs";
  document.getElementById("players").textContent=`⬜ ${white}  vs  ⬛ ${black}`;
  document.getElementById("meta-date").textContent=headers.Date||"";
  document.getElementById("meta-event").textContent=headers.Event&&headers.Event!=="?"?headers.Event:"";
  document.getElementById("meta-tc").textContent=headers.TimeControl||"";
  let res=headers.Result||"";
  let resLabel=res==="1-0"?"⬜ Blancs gagnent":res==="0-1"?"⬛ Noirs gagnent":res==="1/2-1/2"?"🤝 Nulle":res;
  document.getElementById("meta-result").textContent=resLabel;
  document.getElementById("game-info").style.display="block";
  // Meta title
  document.title=`♟ ${white} vs ${black}`;

  parsedMoves=tokens;
  states=buildStates(tokens);
  buildMoveList(tokens);
  cursor=0;
  drawBoard(states[0]);
}

function copyLink(){
  navigator.clipboard.writeText(window.location.href).then(()=>{
    let btn=document.querySelector(".share-btn");
    let orig=btn.textContent;
    btn.textContent="✅ Lien copié !";
    setTimeout(()=>btn.textContent=orig,2000);
  });
}

// Keyboard navigation
window.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight"||e.key==="ArrowDown")step(1);
  if(e.key==="ArrowLeft"||e.key==="ArrowUp")step(-1);
  if(e.key==="Home")goTo(0);
  if(e.key==="End")goTo(-1);
});
// Swipe
let tx=0;
window.addEventListener("touchstart",e=>{tx=e.touches[0].clientX;},{passive:true});
window.addEventListener("touchend",e=>{
  let dx=e.changedTouches[0].clientX-tx;
  if(Math.abs(dx)>50){if(dx<0)step(1);else step(-1);}
},{passive:true});

window.addEventListener("resize",()=>{setSqSize();if(states.length)drawBoard(states[cursor]);});
window.addEventListener("DOMContentLoaded",init);
</script>
</body>
</html>
